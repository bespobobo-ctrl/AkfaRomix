  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);

    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  .mono {
    font-family: "Cascadia Code", "JetBrains Mono", "SF Mono", ui-monospace, Consolas, monospace;
    font-variant-numeric: tabular-nums;
  }
  a { color: var(--accent); }

  .page {
    max-width: 1180px;
    margin: 0 auto;
    padding: 28px 24px 64px;
  }

  /* ---- Top bar ---- */
  .topbar {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 24px;
    flex-wrap: wrap;
    padding-bottom: 20px;

    margin-bottom: 24px;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-mark {
    width: 38px; height: 38px; border-radius: 9px;
    background: var(--accent); color: var(--accent-ink);
    display: flex; align-items: center; justify-content: center;
    font-family: "Cascadia Code", "JetBrains Mono", ui-monospace, monospace;
    font-weight: 700; font-size: 14px; letter-spacing: -0.02em;
    flex-shrink: 0;
  }
  .brand h1 { font-size: 18px; margin: 0; font-weight: 650; letter-spacing: -0.01em; }
  .brand .sub { margin: 2px 0 0; font-size: 12.5px; color: var(--muted); }

  .sweep-status { text-align: right; font-size: 12.5px; color: var(--muted); }
  .sweep-status .label { text-transform: uppercase; letter-spacing: 0.06em; font-size: 10.5px; font-weight: 650; }
  .sweep-status .value { font-family: "Cascadia Code", "JetBrains Mono", ui-monospace, monospace; color: var(--ink); font-size: 13px; margin-top: 2px; }

  /* ---- Summary strip ---- */
  .summary {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
    margin-bottom: 28px;
  }
  .summary .stat {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px 16px;
    box-shadow: var(--shadow);
  }
  .summary .stat .n { font-family: "Cascadia Code", "JetBrains Mono", ui-monospace, monospace; font-size: 24px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
  .summary .stat .l { font-size: 11.5px; color: var(--muted); margin-top: 6px; text-transform: uppercase; letter-spacing: 0.05em; }
  .summary .stat.crit .n { color: var(--critical); }
  .summary .stat.open .n { color: var(--warn); }
  .summary .stat.pending .n { color: var(--pending); }
  .summary .stat.verified .n { color: var(--good); }

  h2.section-title {
    font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--muted); font-weight: 650; margin: 0 0 12px;
  }

  /* ---- Panel cards ---- */
  .panels {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 12px;
    margin-bottom: 32px;
  }
  .panel-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px;
    box-shadow: var(--shadow);
    position: relative;
    overflow: hidden;

  .panel-card .empty-note { font-size: 12px; color: var(--muted); font-style: italic; }

  .filters button.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

  /* ---- Issue list ---- */
  .issues { display: flex; flex-direction: column; gap: 10px; }
  .issue {

  .issue-title { font-size: 14.5px; font-weight: 600; margin: 4px 0 4px; }
  .issue-loc { font-family: "Cascadia Code", "JetBrains Mono", ui-monospace, monospace; font-size: 11.5px; color: var(--muted); }
  .issue-desc { font-size: 13px; color: var(--ink); opacity: 0.85; margin: 8px 0; max-width: 68ch; line-height: 1.5; }

  .pill {
    display: inline-flex; align-items: center; gap: 5px;

  .pill.sev-medium { color: var(--info); background: var(--info-bg); }
  .pill.sev-low { color: var(--muted); background: var(--surface-2); }

  .pill.st-open { color: var(--warn); background: var(--warn-bg); }
  .pill.st-in_progress { color: var(--info); background: var(--info-bg); }
  .pill.st-fixed { color: var(--pending); background: var(--pending-bg); }
  .pill.st-verified { color: var(--good); background: var(--good-bg); }
  .pill.st-needs_revision { color: var(--critical); background: var(--critical-bg); }

  .issue-meta { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 10px; font-size: 12px; color: var(--muted); }

  }

<script>
(function () {
  var data = JSON.parse(document.getElementById("tracker-data").textContent);
  var panels = data.panels || [];
  var issues = data.issues || [];

  var SEV_LABEL = { critical: "Kritik", high: "Yuqori", medium: "O'rta", low: "Past" };
  var ST_LABEL = {
    open: "Yangi", in_progress: "Jarayonda", fixed: "Retest kutilmoqda",
    verified: "Tasdiqlangan", needs_revision: "Qayta ishlash kerak"
  };

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function fmtDate(iso) {
    if (!iso) return "hali yo'q";
    try {
      var d = new Date(iso);
      return d.toLocaleString("uz-UZ", { year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" });
    } catch (e) { return iso; }
  }

  document.getElementById("last-sweep").textContent = data.lastSweepAt ? fmtDate(data.lastSweepAt) : "Hali ishga tushmagan";

  // ---- Summary ----
  var counts = { open: 0, in_progress: 0, fixed: 0, verified: 0, needs_revision: 0, critical: 0 };
  issues.forEach(function (i) {
    counts[i.status] = (counts[i.status] || 0) + 1;
    if (i.severity === "critical" && i.status !== "verified") counts.critical++;
  });

  var summaryEl = document.getElementById("summary");
  var summaryItems = [
    { cls: "crit", n: counts.critical, l: "Kritik ochiq" },
    { cls: "open", n: counts.open, l: "Yangi topilgan" },
    { cls: "pending", n: (counts.fixed || 0) + (counts.needs_revision || 0), l: "Retest / qayta ishlash" },
    { cls: "verified", n: counts.verified, l: "Tasdiqlangan" },
    { cls: "", n: issues.length, l: "Jami muammo" }
  ];
  summaryEl.innerHTML = summaryItems.map(function (s) {
    return '<div class="stat ' + s.cls + '"><div class="n mono">' + s.n + '</div><div class="l">' + esc(s.l) + '</div></div>';
  }).join("");

  // ---- Panel cards ----
  var panelsEl = document.getElementById("panels");
  var stripeColor = { ombor: "var(--info)", buhgalter: "var(--pending)", sotuv: "var(--good)", hr: "var(--warn)", ishlab_chiqarish: "var(--accent)" };
  panelsEl.innerHTML = panels.map(function (p) {
    var pIssues = issues.filter(function (i) { return i.panel === p.id; });
    var open = pIssues.filter(function (i) { return i.status === "open" || i.status === "needs_revision"; }).length;
    var progress = pIssues.filter(function (i) { return i.status === "in_progress" || i.status === "fixed"; }).length;
    var verified = pIssues.filter(function (i) { return i.status === "verified"; }).length;
    var emptyCls = pIssues.length === 0 ? " empty" : "";
    var body = pIssues.length === 0
      ? '<div class="empty-note">Muammo topilmagan / hali skanerlanmagan</div>'
      : '<div class="counts">' +
          '<div class="c"><b style="color:var(--warn)">' + open + '</b><span>Ochiq</span></div>' +
          '<div class="c"><b style="color:var(--pending)">' + progress + '</b><span>Jarayonda</span></div>' +
          '<div class="c"><b style="color:var(--good)">' + verified + '</b><span>Tasdiqlangan</span></div>' +
        '</div>';
    return '<div class="panel-card' + emptyCls + '">' +
      '<div class="stripe" style="background:' + (stripeColor[p.id] || "var(--line)") + '"></div>' +
      '<h3>' + esc(p.label) + '</h3>' +
      '<div class="login">' + esc(p.login) + '</div>' +
      body +
      '</div>';
  }).join("");

  // ---- Issues ----
  var issuesEl = document.getElementById("issues");
  var filtersEl = document.getElementById("filters");
  var footerCount = document.getElementById("footer-count");
  var activeFilter = "all";

  var filterDefs = [{ id: "all", label: "Barchasi" }].concat(panels.map(function (p) { return { id: p.id, label: p.label }; }));

  function renderFilters() {
    filtersEl.innerHTML = filterDefs.map(function (f) {
      return '<button data-f="' + f.id + '" class="' + (f.id === activeFilter ? "active" : "") + '">' + esc(f.label) + '</button>';
    }).join("");
    Array.prototype.forEach.call(filtersEl.querySelectorAll("button"), function (btn) {
      btn.addEventListener("click", function () {
        activeFilter = btn.getAttribute("data-f");
        renderFilters();
        renderIssues();
      });
    });
  }

  function renderIssues() {
    var list = issues.filter(function (i) { return activeFilter === "all" || i.panel === activeFilter; });
    var order = { critical: 0, high: 1, medium: 2, low: 3 };
    list = list.slice().sort(function (a, b) { return (order[a.severity] || 9) - (order[b.severity] || 9); });

    if (list.length === 0) {
      issuesEl.innerHTML = '<div class="empty-state">' +
        '<div class="big">Hozircha muammo qayd etilmagan</div>' +
        '<div class="small">Sardor birinchi sweep\'ni bajargach, har bir paneldan topilgan xatolar shu yerda muhimlik darajasi bilan chiqadi.</div>' +
        '</div>';
      footerCount.textContent = "0 / " + issues.length;
      return;
    }

    issuesEl.innerHTML = list.map(function (i) {
      var disc = (i.discussion || []).map(function (m) {
        return '<div class="msg"><span class="from' + (m.from === "sardor" ? " sardor" : "") + '">' + esc(m.from) + ':</span>' + esc(m.message) + '</div>';
      }).join("");
      return '<div class="issue sev-' + esc(i.severity || "low") + '">' +
        '<div class="issue-top">' +
          '<div>' +
            '<span class="issue-id">' + esc(i.id) + '</span>' +
            '<div class="issue-title">' + esc(i.title) + '</div>' +
            '<div class="issue-loc">' + esc(i.file || "") + (i.line ? ":" + i.line : "") + '</div>' +
          '</div>' +
          '<div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;">' +
            '<span class="pill sev-' + esc(i.severity || "low") + '">' + esc(SEV_LABEL[i.severity] || i.severity) + '</span>' +
            '<span class="pill st-' + esc(i.status || "open") + '">' + esc(ST_LABEL[i.status] || i.status) + '</span>' +
          '</div>' +
        '</div>' +
        (i.description ? '<div class="issue-desc">' + esc(i.description) + '</div>' : '') +
        '<div class="issue-meta">' +
          '<span class="m">Topdi: <b>' + esc(i.foundBy || "—") + '</b></span>' +
          (i.fixedBy ? '<span class="m">Tuzatdi: <b>' + esc(i.fixedBy) + '</b></span>' : '') +
          (i.retest && i.retest.result && i.retest.result !== "pending" ? '<span class="m">Retest: <b>' + esc(i.retest.result === "pass" ? "o’tdi" : "o’tmadi") + '</b></span>' : '') +
          (i.resolution ? '<span class="m">Yechim: <b>' + esc(i.resolution === "optimal" ? "optimal" : "qoniqarli") + '</b></span>' : '') +
        '</div>' +
        (disc ? '<div class="discussion">' + disc + '</div>' : '') +
      '</div>';
    }).join("");
    footerCount.textContent = list.length + " / " + issues.length;
  }

  renderFilters();
  renderIssues();
})();
</script>
