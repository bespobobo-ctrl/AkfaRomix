<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AKFA Romix | HR Mini App 2026</title>
    <!-- Google Fonts: Outfit & Inter -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;600;800;900&display=swap"
        rel="stylesheet">
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- GSAP for Premium Animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <!-- Chart.js for Visual Analytics -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            /* 2026 Premium Color Palette */
            --bg-deep: #05080d;
            --bg-card: rgba(15, 20, 30, 0.6);
            --accent-glow: #00ff88;
            --accent-secondary: #00d2ff;
            --text-main: #ffffff;
            --text-dim: rgba(255, 255, 255, 0.5);
            --border-light: rgba(255, 255, 255, 0.08);
            --glass-blur: 25px;
            --safe-top: env(safe-area-inset-top);
            --safe-bottom: env(safe-area-inset-bottom);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            overflow-x: hidden;
            background-image:
                radial-gradient(circle at 0% 0%, rgba(0, 255, 136, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 100% 100%, rgba(0, 210, 255, 0.05) 0%, transparent 40%);
            min-height: 100vh;
            padding-bottom: calc(90px + var(--safe-bottom));
        }

        h1,
        h2,
        h3,
        .brand-font {
            font-family: 'Outfit', sans-serif;
        }

        /* ✨ PREMIUM ANIMATED BACKGROUND MESH */
        .mesh-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
            filter: blur(80px);
            opacity: 0.4;
        }

        .mesh-blob {
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: var(--accent-glow);
            filter: blur(40px);
            animation: move 20s infinite alternate;
        }

        .mesh-blob-2 {
            background: var(--accent-secondary);
            animation: move 25s infinite alternate-reverse;
            top: 40%;
            left: 60%;
        }

        @keyframes move {
            from {
                transform: translate(-20%, -20%) scale(1);
            }

            to {
                transform: translate(40%, 40%) scale(1.5);
            }
        }

        /* 📱 HEADER SYSTEM */
        .app-header {
            padding: calc(15px + var(--safe-top)) 20px 20px;
            background: rgba(5, 8, 13, 0.7);
            backdrop-filter: blur(var(--glass-blur));
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-light);
        }

        .brand-block {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-ring {
            position: relative;
            width: 44px;
            height: 44px;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--accent-glow), var(--accent-secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(0, 255, 136, 0.3);
        }

        .logo-ring::after {
            content: '';
            position: absolute;
            inset: 2px;
            background: var(--bg-deep);
            border-radius: 12px;
            z-index: 0;
        }

        .logo-ring i {
            position: relative;
            z-index: 1;
            color: var(--accent-glow);
        }

        .header-info h1 {
            font-size: 1.1rem;
            font-weight: 800;
            letter-spacing: -0.2px;
            margin-bottom: 2px;
        }

        .header-info p {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-dim);
            font-weight: 700;
        }

        /* 📊 BENTO DASHBOARD */
        .bento-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            padding: 20px;
        }

        .bento-card {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 28px;
            padding: 20px;
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .bento-card:active {
            transform: scale(0.97);
            background: rgba(255, 255, 255, 0.05);
        }

        .bento-card.wide {
            grid-column: span 2;
        }

        .card-icon {
            width: 32px;
            height: 32px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            color: var(--accent-glow);
        }

        .card-val {
            font-size: 2.2rem;
            font-weight: 900;
            font-family: 'Outfit', sans-serif;
            margin-bottom: 4px;
        }

        .card-label {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* 🔍 ULTRA SEARCH */
        .search-area {
            padding: 0 20px 25px;
        }

        .search-box {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            height: 58px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 15px;
            transition: 0.3s;
        }

        .search-box:focus-within {
            border-color: var(--accent-glow);
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .search-box i {
            color: var(--text-dim);
            font-size: 1.1rem;
        }

        .search-box input {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 1rem;
            font-weight: 500;
            width: 100%;
            outline: none;
        }

        /* 📁 CATEGORY SLIDER */
        .categories {
            display: flex;
            gap: 10px;
            padding: 0 20px 25px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .categories::-webkit-scrollbar {
            display: none;
        }

        .cat-pill {
            flex: 0 0 auto;
            padding: 10px 22px;
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-dim);
            transition: 0.3s;
        }

        .cat-pill.active {
            background: var(--accent-glow);
            color: #000;
            border-color: var(--accent-glow);
            box-shadow: 0 5px 15px rgba(0, 255, 136, 0.2);
        }

        /* 👥 PREMIUM STAFF FEED */
        .staff-section {
            padding: 0 20px;
        }

        .section-headline {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .section-headline h2 {
            font-size: 1.3rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .staff-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .staff-card {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 24px;
            padding: 18px;
            display: flex;
            align-items: center;
            gap: 15px;
            position: relative;
        }

        .staff-photo {
            width: 52px;
            height: 52px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.03);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1.2rem;
            color: var(--accent-secondary);
        }

        .staff-meta {
            flex: 1;
        }

        .staff-meta h4 {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .staff-meta p {
            font-size: 0.75rem;
            color: var(--text-dim);
            font-weight: 500;
        }

        .status-badge {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--accent-glow);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .status-badge.offline {
            background: #ff4d4f;
            box-shadow: 0 0 10px #ff4d4f;
        }

        /* ➕ ACTION FAB */
        .fab {
            position: fixed;
            bottom: calc(110px + var(--safe-bottom));
            right: 25px;
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, var(--accent-glow), #00cc6a);
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            box-shadow: 0 10px 30px rgba(0, 255, 136, 0.3);
            z-index: 1500;
            border: none;
            cursor: pointer;
        }

        /* 🗺️ DYNAMIC BOTTOM NAV */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: calc(85px + var(--safe-bottom));
            background: rgba(5, 8, 13, 0.85);
            backdrop-filter: blur(30px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding-bottom: var(--safe-bottom);
            border-top: 1px solid var(--border-light);
            z-index: 2000;
        }

        .nav-link {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            color: var(--text-dim);
            text-decoration: none;
            transition: 0.3s;
            position: relative;
            padding: 10px 15px;
        }

        .nav-link.active {
            color: var(--accent-glow);
        }

        .nav-link i {
            font-size: 1.3rem;
            transition: 0.3s transform;
        }

        .nav-link.active i {
            transform: translateY(-5px);
        }

        .nav-link span {
            font-size: 0.65rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .nav-indicator {
            position: absolute;
            bottom: 5px;
            width: 4px;
            height: 4px;
            background: var(--accent-glow);
            border-radius: 50%;
            opacity: 0;
            transition: 0.3s;
        }

        .nav-link.active .nav-indicator {
            opacity: 1;
            box-shadow: 0 0 10px var(--accent-glow);
        }

        /* 📥 PREMIUM BOTTOM SHEET */
        .modal-bg {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(15px);
            z-index: 3000;
            display: none;
            align-items: flex-end;
            opacity: 0;
        }

        .sheet {
            width: 100%;
            background: #0f141e;
            border-top: 1px solid var(--border-light);
            border-radius: 40px 40px 0 0;
            padding: 35px 25px calc(30px + var(--safe-bottom));
            transform: translateY(100%);
        }

        .sheet-handle {
            width: 50px;
            height: 5px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            margin: -10px auto 30px;
        }

        /* 🎨 CHART CONTAINER */
        .chart-wrap {
            margin-top: 15px;
            height: 80px;
        }

        /* Hidden or Helper Classes */
        .premium-text {
            background: linear-gradient(90deg, #fff, var(--text-dim));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>

<body>

    <div class="mesh-gradient">
        <div class="mesh-blob"></div>
        <div class="mesh-blob mesh-blob-2"></div>
    </div>

    <header class="app-header">
        <div class="brand-block">
            <div class="logo-ring"><i data-lucide="shield-check" size="24"></i></div>
            <div class="header-info">
                <p id="systemDate">Payshanba, 7 May</p>
                <h1 id="hrName">AKFA Romix HR</h1>
            </div>
        </div>
        <button id="notif-btn" style="background:none; border:none; color:var(--text-dim); position:relative;">
            <i data-lucide="bell" size="24"></i>
            <span
                style="position:absolute; top:0; right:0; width:8px; height:8px; background:var(--accent-glow); border-radius:50%; border:2px solid var(--bg-deep);"></span>
        </button>
    </header>

    <main id="portal-content">
        <!-- QUICK ANALYTICS -->
        <div class="bento-grid">
            <div class="bento-card wide">
                <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                    <div>
                        <div class="card-label">Xodimlar Faoliyati</div>
                        <div class="card-val" id="totalStaffCount">0</div>
                    </div>
                    <div style="text-align:right;">
                        <div style="color:var(--accent-glow); font-weight:800; font-size:0.8rem;">+12% 📈</div>
                        <div style="color:var(--text-dim); font-size:0.6rem;">Oylik O'sish</div>
                    </div>
                </div>
                <div class="chart-wrap"><canvas id="miniDashboardChart"></canvas></div>
            </div>

            <div class="bento-card">
                <div class="card-icon"><i data-lucide="user-check" size="18"></i></div>
                <div class="card-val" id="presentStaffCount" style="color:var(--accent-glow);">0</div>
                <div class="card-label">Bugun Kelgan</div>
            </div>

            <div class="bento-card">
                <div class="card-icon" style="color:var(--accent-secondary);"><i data-lucide="clock" size="18"></i>
                </div>
                <div class="card-val" id="lateStaffCount" style="color:var(--accent-secondary);">0</div>
                <div class="card-label">Kechikkanlar</div>
            </div>
        </div>

        <!-- SEARCH SYSTEM -->
        <div class="search-area">
            <div class="search-box">
                <i data-lucide="search"></i>
                <input type="text" id="hrSearchInput" placeholder="Xodimlarni qidirish...">
            </div>
        </div>

        <!-- CATEGORIES -->
        <div class="categories">
            <div class="cat-pill active">Barchasi</div>
            <div class="cat-pill">Ustalar</div>
            <div class="cat-pill">Ombor</div>
            <div class="cat-pill">Ofis</div>
            <div class="cat-pill">Logistika</div>
        </div>

        <!-- STAFF FEED -->
        <div class="staff-section">
            <div class="section-headline">
                <h2>Xodimlar Ro'yxati</h2>
                <button
                    style="background:none; border:none; color:var(--accent-glow); font-size:0.8rem; font-weight:700;">Filtrlash</button>
            </div>
            <div class="staff-list" id="staffFeed">
                <!-- GSAP Entrance Animation applied to rows -->
                <p style="text-align:center; opacity:0.3; padding:20px;">Ma'lumotlar yuklanmoqda...</p>
            </div>
        </div>
    </main>

    <!-- NAVIGATION 2.0 -->
    <nav class="bottom-nav">
        <a href="#" class="nav-link active">
            <i data-lucide="layout-grid"></i>
            <span>Panel</span>
            <div class="nav-indicator"></div>
        </a>
        <a href="#" class="nav-link">
            <i data-lucide="users"></i>
            <span>Xodimlar</span>
            <div class="nav-indicator"></div>
        </a>
        <a href="#" class="nav-link">
            <i data-lucide="calendar"></i>
            <span>Davomat</span>
            <div class="nav-indicator"></div>
        </a>
        <a href="#" class="nav-link">
            <i data-lucide="file-text"></i>
            <span>Hujjatlar</span>
            <div class="nav-indicator"></div>
        </a>
    </nav>

    <!-- FAB 2026 -->
    <button class="fab" id="fabAddStaff">
        <i data-lucide="plus" size="32"></i>
    </button>

    <!-- PREMIUM BOTTOM SHEET -->
    <div class="modal-bg" id="staffModal">
        <div class="sheet">
            <div class="sheet-handle"></div>
            <h2 class="brand-font" style="font-size:1.8rem; margin-bottom:25px;">Yangi Xodim <br><span
                    style="color:var(--accent-glow);">Ro'yxatga olish</span></h2>

            <div style="display:flex; flex-direction:column; gap:20px;">
                <div style="position:relative;">
                    <span
                        style="position:absolute; top:-8px; left:15px; background:#0f141e; padding:0 5px; font-size:0.6rem; color:var(--text-dim); font-weight:800; letter-spacing:1px;">F.I.O</span>
                    <input type="text" id="addStaffName"
                        style="width:100%; padding:18px; background:rgba(255,255,255,0.03); border:1px solid var(--border-light); border-radius:18px; color:#fff; outline:none;"
                        placeholder="Ism familiya">
                </div>

                <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px;">
                    <div style="position:relative;">
                        <span
                            style="position:absolute; top:-8px; left:15px; background:#0f141e; padding:0 5px; font-size:0.6rem; color:var(--text-dim); font-weight:800; letter-spacing:1px;">BO'LIM</span>
                        <select id="addStaffDept"
                            style="width:100%; padding:18px; background:rgba(255,255,255,0.03); border:1px solid var(--border-light); border-radius:18px; color:#fff; outline:none; appearance:none;">
                            <option value="Ustalar">Ustalar</option>
                            <option value="Ombor">Ombor</option>
                            <option value="Ofis">Ofis</option>
                        </select>
                    </div>
                    <div style="position:relative;">
                        <span
                            style="position:absolute; top:-8px; left:15px; background:#0f141e; padding:0 5px; font-size:0.6rem; color:var(--text-dim); font-weight:800; letter-spacing:1px;">LAVOZIM</span>
                        <input type="text" id="addStaffRole"
                            style="width:100%; padding:18px; background:rgba(255,255,255,0.03); border:1px solid var(--border-light); border-radius:18px; color:#fff; outline:none;"
                            placeholder="Menejer">
                    </div>
                </div>

                <button id="submitAddStaff"
                    style="width:100%; padding:20px; background:var(--accent-glow); color:#000; border:none; border-radius:20px; font-weight:900; font-family:'Outfit'; font-size:1.1rem; margin-top:15px; transition:0.3s; cursor:pointer;"
                    onclick="this.textContent='Saqlanmoqda...'">XODIMNI QO'SHISH</button>
            </div>
        </div>
    </div>

    <!-- Scripting -->
    <script type="module" src="hr_app.js?v=2026.1"></script>
    <script>
        // Initialize Lucide Icons
        lucide.createIcons();

        // 📈 Premium Chart Setup
        document.addEventListener('DOMContentLoaded', () => {
            const ctx = document.getElementById('miniDashboardChart').getContext('2d');
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['D', 'S', 'C', 'P', 'J', 'S', 'Y'],
                    datasets: [{
                        data: [65, 78, 66, 89, 75, 90, 85],
                        borderColor: '#00ff88',
                        borderWidth: 3,
                        pointRadius: 0,
                        tension: 0.4,
                        fill: true,
                        backgroundColor: (context) => {
                            const gradient = ctx.createLinearGradient(0, 0, 0, 80);
                            gradient.addColorStop(0, 'rgba(0, 255, 136, 0.2)');
                            gradient.addColorStop(1, 'rgba(0, 255, 136, 0)');
                            return gradient;
                        }
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { display: false },
                        y: { display: false }
                    }
                }
            });

            // ✨ GSAP Entrance Animations
            gsap.from('.bento-card', {
                y: 50,
                opacity: 0,
                duration: 0.8,
                stagger: 0.15,
                ease: 'power3.out'
            });
            gsap.from('.header-info', { x: -30, opacity: 0, duration: 1, delay: 0.5 });
        });

        // 📥 Bottom Sheet Interaction Logic
        const fab = document.getElementById('fabAddStaff');
        const modal = document.getElementById('staffModal');
        const sheet = modal.querySelector('.sheet');

        fab.onclick = () => {
            modal.style.display = 'flex';
            gsap.to(modal, { opacity: 1, duration: 0.3 });
            gsap.to(sheet, { y: 0, duration: 0.5, ease: 'power4.out' });
        };

        modal.onclick = (e) => {
            if (e.target === modal) {
                gsap.to(sheet, { y: '100%', duration: 0.4, ease: 'power4.in' });
                gsap.to(modal, { opacity: 0, duration: 0.3, delay: 0.2, onComplete: () => modal.style.display = 'none' });
            }
        };
    </script>

</body>

</html>
