<!DOCTYPE html>
<html lang="uz" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AKFA Romix | Nixtio Elite HR</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@400;600;700;800;900&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        /* ═══════════════════════════════════════════
           AKFA ROMIX — NIXTIO ELITE DESIGN SYSTEM 
           ═══════════════════════════════════════════ */

        :root {
            --accent: #00ff88;
            --accent-sec: #00d2ff;
            --bg-dark: #05080c;
            --card-glass: rgba(15, 23, 36, 0.7);
            --border-glass: rgba(255, 255, 255, 0.08);
            --text-p: #ffffff;
            --text-s: rgba(255, 255, 255, 0.6);
            --radius-xl: 32px;
            --radius-l: 24px;
            --glow: 0 0 20px rgba(0, 255, 136, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: var(--bg-dark);
            color: var(--text-p);
            height: 100vh;
            overflow: hidden;
            display: flex;
            padding: 20px;
            gap: 20px;
        }

        .aura {
            position: fixed;
            width: 50vw;
            height: 50vw;
            border-radius: 50%;
            z-index: -1;
            filter: blur(100px);
            pointer-events: none;
            opacity: 0.5;
        }

        .aura-1 {
            top: -10%;
            left: -10%;
            background: radial-gradient(circle, rgba(0, 255, 136, 0.1) 0%, transparent 70%);
        }

        .aura-2 {
            bottom: -10%;
            right: -10%;
            background: radial-gradient(circle, rgba(0, 210, 255, 0.1) 0%, transparent 70%);
        }

        /* 🛰️ SIDEBAR */
        .sidebar {
            width: 100px;
            background: var(--card-glass);
            backdrop-filter: blur(40px);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-xl);
            display: flex;
            flex-direction: column;
            padding: 30px 0;
            align-items: center;
            gap: 15px;
            box-shadow: var(--glow);
            flex-shrink: 0;
            z-index: 10;
        }

        .sidebar-logo {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, var(--accent), var(--accent-sec));
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            font-weight: 900;
            font-size: 1.2rem;
            margin-bottom: 30px;
        }

        .nav-btn {
            width: 56px;
            height: 56px;
            border-radius: 18px;
            border: 1px solid transparent;
            background: transparent;
            color: var(--text-s);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.3s;
        }

        .nav-btn:hover,
        .nav-btn.active {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--border-glass);
            color: var(--accent);
        }

        /* 🏰 MAIN CONTENT AREA */
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
            height: 100%;
            min-width: 0;
        }

        /* 💎 TOP NAV */
        .top-nav {
            height: 90px;
            background: var(--card-glass);
            backdrop-filter: blur(40px);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-xl);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            flex-shrink: 0;
        }

        .brand-title {
            font-family: 'Outfit';
            font-size: 1.6rem;
            font-weight: 900;
            letter-spacing: -1px;
        }

        .brand-title span {
            color: var(--accent);
        }

        .search-container {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-glass);
            padding: 10px 25px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            width: 350px;
        }

        .search-container input {
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            width: 100%;
            font-size: 0.9rem;
        }

        /* 🍱 BENTO GRID LOGIC */
        .bento-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: auto 1fr;
            gap: 20px;
            min-height: 0;
            /* Important for scroll */
        }

        .bento-card {
            background: var(--card-glass);
            backdrop-filter: blur(40px);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-xl);
            padding: 25px;
            box-shadow: var(--glow);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* STATS */
        .stat-card {
            justify-content: center;
            min-height: 120px;
        }

        .stat-label {
            font-size: 0.7rem;
            color: var(--text-s);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .stat-value {
            font-family: 'Outfit';
            font-size: 2rem;
            font-weight: 900;
            color: var(--accent);
        }

        /* STAFF LIST */
        .staff-panel {
            grid-row: span 2;
        }

        .dept-pills {
            display: flex;
            gap: 8px;
            padding-bottom: 15px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .pill {
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-glass);
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
        }

        .pill.active {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
        }

        .staff-scroller {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .staff-item {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-glass);
            padding: 15px;
            border-radius: var(--radius-l);
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            transition: 0.2s;
        }

        .staff-item:hover,
        .staff-item.active {
            background: rgba(0, 255, 136, 0.1);
            border-color: var(--accent);
        }

        .staff-img {
            width: 50px;
            height: 50px;
            border-radius: 15px;
            object-fit: cover;
        }

        .add-btn-lux {
            width: 100%;
            height: 60px;
            background: linear-gradient(135deg, var(--accent), #00cc6a);
            border: none;
            border-radius: 18px;
            color: #000;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
        }

        /* PROFILE DETAIL */
        .profile-panel {
            grid-column: span 3;
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 30px;
        }

        .hero-img-wrap {
            position: relative;
            margin-bottom: 20px;
        }

        .hero-img {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            object-fit: cover;
            border: 6px solid rgba(255, 255, 255, 0.05);
        }

        .hero-name {
            font-family: 'Outfit';
            font-size: 2rem;
            font-weight: 900;
        }

        .hero-role {
            padding: 5px 15px;
            background: rgba(0, 255, 136, 0.1);
            color: var(--accent);
            border-radius: 10px;
            font-weight: 800;
            font-size: 0.75rem;
        }

        .profile-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .lux-stat-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
        }

        .lux-stat-val {
            font-family: 'Outfit';
            font-size: 1.6rem;
            font-weight: 900;
        }

        .lux-stat-lab {
            font-size: 0.6rem;
            color: var(--text-s);
            font-weight: 800;
            margin-top: 5px;
        }

        /* MODALS */
        .modal-blur {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(20px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            width: 600px;
            background: #0f172a;
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-xl);
            padding: 40px;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.5);
        }

        .lux-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        .lux-field {
            position: relative;
        }

        .lux-field label {
            position: absolute;
            top: -7px;
            left: 12px;
            font-size: 0.6rem;
            color: var(--accent);
            background: #0f172a;
            padding: 0 5px;
            font-weight: 800;
        }

        .lux-input {
            width: 100%;
            padding: 15px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-glass);
            border-radius: 12px;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
        }

        .lux-input:focus {
            border-color: var(--accent);
        }

        /* Badge Modal */
        .badge-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(30px);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .badge-lux-card {
            width: 360px;
            height: 530px;
            background: #fff;
            border-radius: 35px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            color: #000;
        }

        .badge-lux-top {
            background: #000;
            padding: 30px;
            text-align: center;
            color: var(--accent);
            font-family: 'Outfit';
            font-weight: 900;
            font-size: 1.4rem;
        }
    </style>
</head>

<body>
    <div class="aura aura-1"></div>
    <div class="aura aura-2"></div>

    <nav class="sidebar">
        <div class="sidebar-logo">AR</div>
        <button class="nav-btn active"><i data-lucide="layout-grid"></i></button>
        <button class="nav-btn"><i data-lucide="users"></i></button>
        <button class="nav-btn"><i data-lucide="calendar-check"></i></button>
        <button class="nav-btn"><i data-lucide="bar-chart"></i></button>
        <div style="flex:1"></div>
        <button class="nav-btn" id="logoutBtn"><i data-lucide="log-out"></i></button>
    </nav>

    <div class="main-container">
        <header class="top-nav">
            <h1 class="brand-title">AKFA ROMIX <span>HR</span></h1>
            <div class="search-container">
                <i data-lucide="search" size="18" style="color:var(--text-s)"></i>
                <input type="text" id="hrSearchInput" placeholder="Xodimlarni qidirish...">
            </div>
            <div style="display:flex; align-items:center; gap:15px;">
                <div style="width:40px; height:40px; border-radius:12px; background:linear-gradient(135deg, var(--accent), var(--accent-sec)); display:flex; align-items:center; justify-content:center; color:#000; font-weight:900"
                    id="userInitials">A</div>
                <div style="font-size:0.8rem; font-weight:700" id="userNameLabel">Admin Panel</div>
            </div>
        </header>

        <div class="bento-grid">
            <div class="bento-card stat-card"><span class="stat-label">Jami Xodimlar</span><span class="stat-value"
                    id="totalEmployeesCount">0</span></div>
            <div class="bento-card stat-card"><span class="stat-label">Hozir Ishda</span><span class="stat-value"
                    id="todayArrivedCount">0</span></div>
            <div class="bento-card stat-card"><span class="stat-label">Kechikkanlar</span><span class="stat-value"
                    id="todayLateCount" style="color:#ff4d4f">0</span></div>
            <div class="bento-card stat-card"><span class="stat-label">Oylik Fond</span><span class="stat-value"
                    id="payrollTotal" style="font-size:1.4rem">0</span></div>

            <div class="bento-card staff-panel">
                <h3 style="font-size:1rem; font-weight:800; margin-bottom:15px;">XODIMLAR RO'YXATI</h3>
                <div class="dept-pills">
                    <div class="pill active" data-dept="all">Barchasi</div>
                    <div class="pill" data-dept="Ustalar">Ustalar</div>
                    <div class="pill" data-dept="Ombor">Ombor</div>
                </div>
                <div class="staff-scroller" id="employeeList"></div>
                <button class="add-btn-lux" id="addWorkerBtn"><i data-lucide="plus-circle"></i> YANGI XODIM</button>
            </div>

            <div class="bento-card profile-panel" id="profileDetail">
                <div style="display:flex; flex-direction:column; align-items:center; padding:20px;">
                    <img src="" id="dt-photo" class="hero-img">
                    <h2 class="hero-name" id="dt-name">...</h2>
                    <span class="hero-role" id="dt-role">---</span>
                    <div style="margin-top:20px; width:100%; font-size:0.8rem;">
                        <p style="color:var(--text-s)">Tel: <b id="dt-phone" style="color:#fff">---</b></p>
                        <p style="color:var(--text-s)">Bo'lim: <b id="dt-dept" style="color:#fff">---</b></p>
                    </div>
                </div>
                <div style="display:flex; flex-direction:column; gap:20px;">
                    <div class="profile-stats">
                        <div class="lux-stat-box">
                            <div class="lux-stat-val" id="dt-salary">0</div>
                            <div class="lux-stat-lab">OYLIK</div>
                        </div>
                        <div class="lux-stat-box">
                            <div class="lux-stat-val" id="dt-kpi">0%</div>
                            <div class="lux-stat-lab">KPI</div>
                        </div>
                        <div class="lux-stat-box">
                            <div class="lux-stat-val" id="dt-attendance">0%</div>
                            <div class="lux-stat-lab">DAVOMAT</div>
                        </div>
                    </div>
                    <div
                        style="flex:1; background:rgba(255,255,255,0.01); border-radius:25px; border:1px solid var(--border-glass); padding:20px;">
                        <canvas id="detailActivityChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL ADD -->
    <div class="modal-blur" id="addWorkerModalOverlay">
        <div class="modal-content">
            <h2 style="font-family:'Outfit'; font-size:1.8rem; font-weight:900;">YANGI XODIM</h2>
            <div style="display:flex; gap:20px; align-items:center; margin-top:20px;">
                <div style="width:100px; height:100px; border-radius:20px; background:rgba(255,255,255,0.03); border:2px dashed var(--border-glass); display:flex; align-items:center; justify-content:center; cursor:pointer; overflow:hidden;"
                    onclick="document.getElementById('empPhotoFile').click()">
                    <i data-lucide="camera" id="plusIcon"></i>
                    <img id="modalPhotoPreview" style="display:none; width:100%; height:100%; object-fit:cover;">
                    <input type="file" id="empPhotoFile" hidden accept="image/*">
                </div>
                <p style="font-size:0.8rem; color:var(--text-s)">Xodim uchun PNG/JPG rasm tanlang</p>
            </div>
            <div class="lux-grid">
                <div class="lux-field"><label>ISM</label><input type="text" id="empFirstName" class="lux-input"></div>
                <div class="lux-field"><label>FAMILIYA</label><input type="text" id="empLastName" class="lux-input">
                </div>
                <div class="lux-field"><label>BO'LIM</label>
                    <select id="empDept" class="lux-input">
                        <option value="Ofis">Ofis</option>
                        <option value="Ustalar">Ustalar</option>
                        <option value="Ombor">Ombor</option>
                    </select>
                </div>
                <div class="lux-field"><label>LAVOZIM</label><input type="text" id="empRole" class="lux-input"></div>
                <div class="lux-field"><label>OYLIK</label><input type="number" id="empSalary" class="lux-input"></div>
                <div class="lux-field"><label>TELEFON</label><input type="text" id="empPhone" class="lux-input"></div>
                <div class="lux-field"><label>TUG'ILGAN YIL</label><input type="number" id="empBirthYear"
                        class="lux-input"></div>
                <div class="lux-field"><label>ISHGA KIRGAN YIL</label><input type="number" id="empJoinedYear"
                        class="lux-input"></div>
            </div>
            <div style="display:flex; gap:15px; margin-top:30px;">
                <button id="closeAddWorkerBtn"
                    style="flex:1; padding:15px; background:rgba(255,255,255,0.05); border:none; border-radius:15px; color:#fff; cursor:pointer;">BEKOR
                    QILISH</button>
                <button id="saveWorkerBtn"
                    style="flex:2; padding:15px; background:var(--accent); border:none; border-radius:15px; color:#000; font-weight:800; cursor:pointer;">SAQLASH</button>
            </div>
        </div>
    </div>

    <!-- MODAL BADGE -->
    <div class="badge-modal-overlay" id="badgeModalOverlay">
        <div class="badge-lux-card" id="badgePrintArea">
            <div class="badge-lux-top">AKFA ROMIX</div>
            <img id="badgePreviewPhoto"
                style="width:160px; height:160px; border-radius:50%; border:8px solid #fff; margin:-80px auto 10px; object-fit:cover;">
            <div style="text-align:center; padding:20px; flex:1;">
                <div id="badgePreviewRole"
                    style="background:var(--accent); display:inline-block; padding:5px 20px; border-radius:20px; font-size:0.8rem; font-weight:800;">
                    LAVOZIM</div>
                <h2 id="badgePreviewSurname" style="font-size:2rem; font-weight:900; margin-top:20px;">FAMILIYA</h2>
                <h3 id="badgePreviewName" style="font-size:1.2rem; color:#666;">ISM</h3>
            </div>
            <div
                style="background:#f8f9fa; padding:25px; display:flex; justify-content:space-between; align-items:center;">
                <b id="badgePreviewID">ID: 0000</b>
                <img id="badgePreviewQR" style="width:70px; height:70px;">
            </div>
        </div>
        <div style="margin-top:30px; display:flex; gap:20px;">
            <button id="closeBadgeBtn"
                style="padding:15px 30px; background:#333; color:#fff; border:none; border-radius:15px; cursor:pointer;">YOPISH</button>
            <button onclick="window.printBadge()"
                style="padding:15px 40px; background:var(--accent); color:#000; font-weight:800; border:none; border-radius:15px; cursor:pointer;">YUKLAB
                OLISH</button>
        </div>
    </div>

    <script type="module" src="hr.js?v=final"></script>
    <script>
        lucide.createIcons();
        gsap.from(".sidebar", { x: -100, opacity: 0, duration: 1 });
        gsap.from(".top-nav", { y: -50, opacity: 0, duration: 1, delay: 0.2 });
        gsap.from(".bento-card", { opacity: 0, y: 30, duration: 0.8, stagger: 0.1, delay: 0.4 });
    </script>
</body>

</html>
