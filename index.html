<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AKFA Romix - Auth v1.1</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/css/style.css" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            position: relative;
            z-index: 10;
        }

        .auth-card {
            width: 100%;
            max-width: 400px;
            padding: 40px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .auth-card h1 {
            color: var(--accent-color);
            font-size: 1.8rem;
            margin-bottom: 8px;
        }

        .auth-card p {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 24px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-align: left;
        }

        .input-group label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .auth-input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 210, 255, 0.2);
            padding: 14px;
            border-radius: 8px;
            color: #fff;
            font-family: inherit;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .auth-input:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .auth-btn {
            margin-top: 10px;
            width: 100%;
            padding: 14px;
            font-size: 1rem;
        }

        .error-msg {
            color: #ff4d4f;
            font-size: 0.85rem;
            min-height: 20px;
        }
    </style>
</head>

<body>
    <!-- Smoke Effect -->
    <div class="smoke-container">
        <div class="smoke smoke-1"></div>
        <div class="smoke smoke-2"></div>
        <div class="smoke smoke-3"></div>
        <div class="smoke smoke-4"></div>
    </div>
    <div class="bg-glow"></div>
    <div class="bg-glow bg-glow-secondary"></div>

    <div class="auth-container">
        <div class="auth-card glass-panel" id="roleSelector">
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"
                style="margin: 0 auto 20px;">
                <rect width="24" height="24" rx="6" fill="var(--accent-color)" />
                <path d="M12 7V17M7 12H17" stroke="#001830" stroke-width="2" stroke-linecap="round" />
            </svg>
            <h1 style="margin-bottom:10px;">Xush Kelibsiz!</h1>
            <p style="margin-bottom:30px; opacity:0.7;">Tizimdan foydalanish turini tanlang</p>

            <div style="display:flex; flex-direction:column; gap:12px;">
                <button class="primary-btn" onclick="window.selectRole('management')"
                    style="height:70px; border-radius:18px; font-weight:900; background:linear-gradient(90deg, var(--accent-color), #00d2ff); color:#000;">
                    <i data-lucide="shield-check"></i> RAHBAR (ADMIN / HR)
                </button>
                <button class="primary-btn" onclick="window.selectRole('employee')"
                    style="height:70px; border-radius:18px; font-weight:900; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); color:#fff;">
                    <i data-lucide="user"></i> ODDIY XODIM (USER)
                </button>
            </div>
        </div>

        <div class="auth-card glass-panel" id="loginCard" style="display:none; opacity:0;">
            <!-- Back Button -->
            <button onclick="window.goBackToRole()"
                style="background:none; border:none; color:var(--text-secondary); display:flex; align-items:center; gap:5px; font-size:0.8rem; cursor:pointer; margin-bottom:20px;">
                <i data-lucide="arrow-left" size="14"></i> ORTGA QAYTISH
            </button>

            <div>
                <h1 id="loginTitle">AKFA Romix</h1>
                <p id="loginSubtitle">Tizimga kirish uchun malumotlarni kiriting</p>
            </div>

            <!-- QR SCANNER AREA -->
            <div id="qrScannerArea" style="display:none; margin: 15px 0;">
                <div id="reader"
                    style="width:100%; border-radius:20px; overflow:hidden; border:2px solid var(--accent-color); background:#000;">
                </div>
                <div style="margin-top:10px; padding:10px; background:rgba(0,210,255,0.1); border-radius:12px;">
                    <p style="font-size:0.75rem; color:var(--accent-color); font-weight:800; letter-spacing:1px;">📷
                        BEJIGINGIZNI SKANERLANG</p>
                </div>
            </div>

            <form id="loginForm">
                <div id="usernameGroup" class="input-group">
                    <label id="usernameLabel">Login (Username)</label>
                    <input type="text" id="username" class="auth-input" placeholder="..." required />
                </div>
                <br>
                <div id="passwordGroup" class="input-group">
                    <label>Parol</label>
                    <input type="password" id="password" class="auth-input" placeholder="••••••••" required />
                </div>

                <div class="error-msg" id="errorMsg"></div>

                <button type="submit" class="primary-btn auth-btn">Kirish</button>
            </form>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script>
        lucide.createIcons();
        let html5QrScanner = null;

        window.selectRole = function (role) {
            const roleSelector = document.getElementById('roleSelector');
            const loginCard = document.getElementById('loginCard');
            const usernameLabel = document.getElementById('usernameLabel');
            const usernameInput = document.getElementById('username');
            const passGroup = document.getElementById('passwordGroup');
            const passInput = document.getElementById('password');
            const qrArea = document.getElementById('qrScannerArea');

            gsap.to(roleSelector, {
                opacity: 0, y: -20, duration: 0.3, onComplete: () => {
                    roleSelector.style.display = 'none';
                    loginCard.style.display = 'flex';

                    if (role === 'employee') {
                        document.getElementById('loginTitle').innerText = 'Xodim Kirishi';
                        document.getElementById('loginSubtitle').innerText = 'Bejigingizni ko\'rsating yoki ID yozing';
                        usernameLabel.innerText = 'Xodim ID raqami';
                        usernameInput.placeholder = 'Masalan: 12345';
                        passGroup.style.display = 'none';
                        passInput.required = false;
                        passInput.value = '';
                        qrArea.style.display = 'block';
                        startScanner();
                    } else {
                        document.getElementById('loginTitle').innerText = 'Rahbar Kirishi';
                        usernameLabel.innerText = 'Login (Username)';
                        usernameInput.placeholder = 'rahbar yoki usta...';
                        passGroup.style.display = 'flex';
                        passInput.required = true;
                        qrArea.style.display = 'none';
                        stopScanner();
                    }

                    gsap.to(loginCard, { opacity: 1, y: 0, duration: 0.4 });
                    lucide.createIcons();
                }
            });
        };

        function startScanner() {
            if (html5QrScanner) html5QrScanner.clear();
            html5QrScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
            html5QrScanner.render(onScanSuccess);
        }

        function stopScanner() {
            if (html5QrScanner) {
                html5QrScanner.clear().catch(e => console.log(e));
                html5QrScanner = null;
            }
        }

        function onScanSuccess(decodedText) {
            if (decodedText.startsWith('ROMIX-STAFF-')) {
                const id = decodedText.split('ROMIX-STAFF-')[1];
                document.getElementById('username').value = id;
                document.getElementById('password').value = id; // Auth service uses ID as password for employees
                stopScanner();
                // Trigger natural form submission
                document.getElementById('loginForm').dispatchEvent(new Event('submit', { cancelable: true, bubbles: true }));
            }
        }

        window.goBackToRole = function () {
            stopScanner();
            const roleSelector = document.getElementById('roleSelector');
            const loginCard = document.getElementById('loginCard');

            gsap.to(loginCard, {
                opacity: 0, y: 20, duration: 0.3, onComplete: () => {
                    loginCard.style.display = 'none';
                    roleSelector.style.display = 'flex';
                    gsap.to(roleSelector, { opacity: 1, y: 0, duration: 0.4 });
                }
            });
        };
    </script>

    <script type="module" src="/src/js/core/auth.js?v=2026.update"></script>
</body>

</html>
