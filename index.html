<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AKFA Romix - Auth</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css" />
    <style>
        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            position: relative;
            z-index: 10;
        }

        .auth-card {
            width: 100%;
            max-width: 400px;
            padding: 40px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .auth-card h1 {
            color: var(--accent-color);
            font-size: 1.8rem;
            margin-bottom: 8px;
        }

        .auth-card p {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 24px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-align: left;
        }

        .input-group label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .auth-input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 210, 255, 0.2);
            padding: 14px;
            border-radius: 8px;
            color: #fff;
            font-family: inherit;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .auth-input:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .auth-btn {
            margin-top: 10px;
            width: 100%;
            padding: 14px;
            font-size: 1rem;
        }

        .error-msg {
            color: #ff4d4f;
            font-size: 0.85rem;
            min-height: 20px;
        }
    </style>
</head>

<body>
    <!-- Smoke Effect -->
    <div class="smoke-container">
        <div class="smoke smoke-1"></div>
        <div class="smoke smoke-2"></div>
        <div class="smoke smoke-3"></div>
        <div class="smoke smoke-4"></div>
    </div>
    <div class="bg-glow"></div>
    <div class="bg-glow bg-glow-secondary"></div>

    <div class="auth-container">
        <div class="auth-card glass-panel">
            <!-- Logo -->
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"
                style="margin: 0 auto;">
                <rect width="24" height="24" rx="4" fill="#00D2FF" />
                <path d="M7 17L12 7L17 17" stroke="#001830" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round" />
            </svg>

            <div>
                <h1>AKFA Romix</h1>
                <p>Tizimga kirish uchun login va parolingizni kiriting</p>
            </div>

            <form id="loginForm">
                <div class="input-group">
                    <label>Login (Username)</label>
                    <input type="text" id="username" class="auth-input" placeholder="rahbar yoki usta..." required />
                </div>
                <br>
                <div class="input-group">
                    <label>Parol</label>
                    <input type="password" id="password" class="auth-input" placeholder="••••••••" required />
                </div>

                <div class="error-msg" id="errorMsg"></div>

                <button type="submit" class="primary-btn auth-btn">Kirish</button>
            </form>
        </div>
    </div>

    <script type="module" src="/auth.js"></script>
</body>

</html>
