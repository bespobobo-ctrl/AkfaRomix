<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AKFA Romix - Auth v1.1</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/css/style.css" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        :root {
            --accent-glow: rgba(0, 210, 255, 0.3);
            --card-bg: rgba(10, 25, 47, 0.7);
        }

        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            position: relative;
            z-index: 10;
            padding: 20px;
        }

        .auth-card {
            width: 100%;
            max-width: 440px;
            padding: 50px 40px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 25px;
            border-radius: 32px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            background: var(--card-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
        }

        .auth-card h1 {
            color: #fff;
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 5px;
            letter-spacing: -0.5px;
            background: linear-gradient(to bottom, #fff 0%, #a0aec0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .auth-card p {
            color: var(--text-secondary);
            font-size: 0.95rem;
            font-weight: 400;
            margin-bottom: 20px;
        }

        .role-btn {
            position: relative;
            height: 85px;
            border-radius: 24px;
            font-weight: 700;
            font-size: 1.05rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow: hidden;
        }

        .role-btn i {
            width: 24px;
            height: 24px;
        }

        .role-btn.primary {
            background: linear-gradient(135deg, var(--accent-color) 0%, #00a3ff 100%);
            color: #001830;
            box-shadow: 0 15px 30px -10px rgba(0, 210, 255, 0.4);
        }

        .role-btn.secondary {
            background: rgba(255, 255, 255, 0.03);
            color: #fff;
            backdrop-filter: blur(10px);
        }

        .role-btn:hover {
            transform: translateY(-5px) scale(1.02);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .role-btn.secondary:hover {
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 15px 30px -10px rgba(0, 0, 0, 0.3);
        }

        .role-btn.primary:hover {
            box-shadow: 0 20px 40px -10px rgba(0, 210, 255, 0.6);
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            text-align: left;
        }

        .input-group label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding-left: 5px;
        }

        .auth-input {
            background: rgba(0, 0, 0, 0.2);
            border: 1.5px solid rgba(255, 255, 255, 0.08);
            padding: 16px 20px;
            border-radius: 18px;
            color: #fff;
            font-family: inherit;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .auth-input:focus {
            outline: none;
            border-color: var(--accent-color);
            background: rgba(0, 0, 0, 0.4);
            box-shadow: 0 0 0 4px var(--accent-glow);
        }

        .auth-btn {
            height: 65px;
            border-radius: 20px;
            font-size: 1.1rem;
            font-weight: 800;
            margin-top: 15px;
            letter-spacing: 0.5px;
        }

        .error-msg {
            color: #ff4d4f;
            font-size: 0.85rem;
            font-weight: 500;
            min-height: 20px;
        }

        /* Particles/Grid Overlay */
        .bg-pattern {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(rgba(0, 210, 255, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 1;
            pointer-events: none;
        }
    </style>
</head>

<body>
    <div class="bg-pattern"></div>
    <!-- Smoke Effect -->
    <div class="smoke-container">
        <div class="smoke smoke-1"></div>
        <div class="smoke smoke-2"></div>
        <div class="smoke smoke-3"></div>
        <div class="smoke smoke-4"></div>
    </div>
    <div class="bg-glow"></div>
    <div class="bg-glow bg-glow-secondary"></div>

    <div class="auth-container">
        <div class="auth-card" id="roleSelector">
            <div
                style="width: 72px; height: 72px; background: rgba(0,210,255,0.1); border-radius: 22px; display: flex; align-items: center; justify-content: center; margin: 0 auto 10px; border: 1px solid var(--accent-color);">
                <i data-lucide="layout-grid" style="color: var(--accent-color); width: 32px; height: 32px;"></i>
            </div>
            <div>
                <h1>Xush Kelibsiz!</h1>
                <p>Davom etish uchun tizimdagi rolingizni tanlang</p>
            </div>

            <div style="display:flex; flex-direction:column; gap:15px;">
                <button class="role-btn primary" onclick="window.selectRole('management')">
                    <i data-lucide="shield-check"></i> RAHBAR (ADMIN / HR)
                </button>
                <button class="role-btn secondary" onclick="window.selectRole('employee')">
                    <i data-lucide="user-circle"></i> ODDIY XODIM (USER)
                </button>
            </div>

            <p style="font-size: 0.75rem; opacity: 0.5; margin-top: 10px;">AKFA Romix &copy; 2026 Barcha huquqlar
                himoyalangan</p>
        </div>

        <div class="auth-card" id="loginCard" style="display:none; opacity:0;">
            <!-- Back Button -->
            <button onclick="window.goBackToRole()"
                style="background:rgba(255,255,255,0.05); border:none; color:#fff; width: 40px; height: 40px; border-radius: 12px; display:flex; align-items:center; justify-content:center; cursor:pointer; position: absolute; top: 30px; left: 30px; border: 1px solid rgba(255,255,255,0.1);">
                <i data-lucide="arrow-left" size="18"></i>
            </button>

            <div style="margin-top: 20px;">
                <h1 id="loginTitle" style="font-size: 1.8rem;">AKFA Romix</h1>
                <p id="loginSubtitle">Tizimga kirish uchun ma'lumotlarni kiriting</p>
            </div>

            <!-- QR SCANNER AREA -->
            <div id="qrScannerArea" style="display:none; margin: 5px 0;">
                <div id="reader"
                    style="width:100%; border-radius:24px; overflow:hidden; border:2px solid var(--accent-color); background:#000; box-shadow: 0 0 30px rgba(0,210,255,0.2);">
                </div>
                <div
                    style="margin-top:15px; padding:12px; background:rgba(0,210,255,0.05); border-radius:14px; border: 1px dashed var(--accent-color);">
                    <p
                        style="font-size:0.7rem; color:var(--accent-color); font-weight:800; letter-spacing:1.5px; text-transform: uppercase;">
                        📷 BEJIKNI SKANERLANG
                    </p>
                </div>
            </div>

            <form id="loginForm" style="display: flex; flex-direction: column; gap: 18px;">
                <div id="usernameGroup" class="input-group">
                    <label id="usernameLabel">Login (Username)</label>
                    <input type="text" id="username" class="auth-input" placeholder="..." required />
                </div>

                <div id="passwordGroup" class="input-group">
                    <label>Parol</label>
                    <input type="password" id="password" class="auth-input" placeholder="••••••••" required />
                </div>

                <div class="error-msg" id="errorMsg"></div>

                <button type="submit" class="primary-btn auth-btn">Tizimga kirish</button>
            </form>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script>
        lucide.createIcons();
        let html5QrScanner = null;

        window.selectRole = function (role) {
            const roleSelector = document.getElementById('roleSelector');
            const loginCard = document.getElementById('loginCard');
            const usernameLabel = document.getElementById('usernameLabel');
            const usernameInput = document.getElementById('username');
            const passGroup = document.getElementById('passwordGroup');
            const passInput = document.getElementById('password');
            const qrArea = document.getElementById('qrScannerArea');

            gsap.to(roleSelector, {
                opacity: 0, y: -20, duration: 0.3, onComplete: () => {
                    roleSelector.style.display = 'none';
                    loginCard.style.display = 'flex';

                    if (role === 'employee') {
                        document.getElementById('loginTitle').innerText = 'Xodim Kirishi';
                        document.getElementById('loginSubtitle').innerText = 'Bejigingizni ko\'rsating yoki ID yozing';
                        usernameLabel.innerText = 'Xodim ID raqami';
                        usernameInput.placeholder = 'Masalan: 12345';
                        passGroup.style.display = 'none';
                        passInput.required = false;
                        passInput.value = '';
                        qrArea.style.display = 'block';
                        startScanner();
                    } else {
                        document.getElementById('loginTitle').innerText = 'Rahbar Kirishi';
                        usernameLabel.innerText = 'Login (Username)';
                        usernameInput.placeholder = 'rahbar yoki usta...';
                        passGroup.style.display = 'flex';
                        passInput.required = true;
                        qrArea.style.display = 'none';
                        stopScanner();
                    }

                    gsap.to(loginCard, { opacity: 1, y: 0, duration: 0.4 });
                    lucide.createIcons();
                }
            });
        };

        function startScanner() {
            if (html5QrScanner) html5QrScanner.clear();
            html5QrScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
            html5QrScanner.render(onScanSuccess);
        }

        function stopScanner() {
            if (html5QrScanner) {
                html5QrScanner.clear().catch(e => console.log(e));
                html5QrScanner = null;
            }
        }

        function onScanSuccess(decodedText) {
            if (decodedText.startsWith('ROMIX-STAFF-')) {
                const id = decodedText.split('ROMIX-STAFF-')[1];
                document.getElementById('username').value = id;
                document.getElementById('password').value = id; // Auth service uses ID as password for employees
                stopScanner();
                // Trigger natural form submission
                document.getElementById('loginForm').dispatchEvent(new Event('submit', { cancelable: true, bubbles: true }));
            }
        }

        window.goBackToRole = function () {
            stopScanner();
            const roleSelector = document.getElementById('roleSelector');
            const loginCard = document.getElementById('loginCard');

            gsap.to(loginCard, {
                opacity: 0, y: 20, duration: 0.3, onComplete: () => {
                    loginCard.style.display = 'none';
                    roleSelector.style.display = 'flex';
                    gsap.to(roleSelector, { opacity: 1, y: 0, duration: 0.4 });
                }
            });
        };
    </script>

    <script type="module" src="/src/js/core/auth.js?v=2026.update"></script>
</body>

</html>
