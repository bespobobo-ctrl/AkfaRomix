<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AKFA Romix - Ishchi Paneli</title>
    <!-- Google Fonts: Outfit -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css" />
</head>

<body>
    <!-- Background Elements -->
    <div class="smoke-container">
        <script type="module" src="/src/projects/romix/hr/employee.js"></script>
        <div class="smoke smoke-1"></div>
        <div class="smoke smoke-2"></div>
        <div class="smoke smoke-3"></div>
        <div class="smoke smoke-4"></div>
    </div>
    <div class="bg-glow"></div>
    <div class="bg-glow bg-glow-secondary"></div>

    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar glass-panel">
            <div class="logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect width="24" height="24" rx="4" fill="#00D2FF" />
                    <path d="M7 17L12 7L17 17" stroke="#001830" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" />
                </svg>
                <span>Usta Panel</span>
            </div>
            <nav class="nav-menu">
                <a href="#" class="nav-item active">
                    <i class="icon">📋</i>
                    <span>Mening Vazifalarim</span>
                </a>
                <a href="#" class="nav-item">
                    <i class="icon">📐</i>
                    <span>O'lchov Kiritish</span>
                </a>
            </nav>
            <div class="user-profile">
                <div class="avatar">
                    <img src="https://ui-avatars.com/api/?name=Usta&background=ffb800&color=fff" alt="Usta">
                </div>
                <div class="user-info">
                    <p class="name" id="userNameLabel">Usta/Worker</p>
                    <p class="role">Xodim</p>
                </div>
                <button id="logoutBtn"
                    style="background: none; border: none; color: #ff4d4f; cursor: pointer; padding: 5px;">🚪</button>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <header class="top-header glass-panel">
                <div>
                    <h2 style="font-size: 1.2rem; font-weight: 500;">Xush kelibsiz! Bugungi ishlaringiz</h2>
                </div>
                <div class="header-actions">
                    <button class="primary-btn">Chizma (Surat) Yuklash</button>
                </div>
            </header>

            <!-- Tasks Data -->
            <div class="dashboard-grid">
                <div class="recent-orders glass-panel" style="grid-column: span 3;">
                    <div class="section-header">
                        <h2>Bajarilishi kerak bo'lgan o'lchovlar</h2>
                    </div>
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Mijoz</th>
                                <th>Manzil va Telefon</th>
                                <th>Harakat</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>#AKFA-045</td>
                                <td>Aliyev Vali</td>
                                <td>+998 90 123 45 67<br><small>Toshkent sh. Chilonzor 12-mavze</small></td>
                                <td><button class="primary-btn" style="padding: 6px 12px; font-size:0.8rem;">O'lchovni
                                        yozish</button></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Basic logic for employee page
        document.addEventListener('DOMContentLoaded', () => {
            const user = JSON.parse(localStorage.getItem('currentUser'));
            if (!user || user.role !== 'employee') {
                // Access Denied, redirect to login
                window.location.href = '/';
            } else {
                document.getElementById('userNameLabel').textContent = user.username.toUpperCase();
            }

            document.getElementById('logoutBtn').addEventListener('click', () => {
                localStorage.removeItem('currentUser');
                window.location.href = '/';
            });
        });
    </script>
</body>

</html>
