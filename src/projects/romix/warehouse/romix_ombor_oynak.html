<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AKFA Romix - Oynak Ombori</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/css/style.css" />
    <style>
        .warehouse-body {
            background: var(--adm-bg);
            color: var(--adm-text);
            transition: 0.3s;
            font-family: 'Outfit', sans-serif;
        }

        /* --- Premium Bento System --- */
        .bento-container {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 20px;
            padding: 20px 0;
        }

        .bento-item {
            background: var(--adm-surface);
            border-radius: 24px;
            padding: 24px;
            border: 1px solid var(--adm-border);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        .dark-mode .bento-item {
            background: rgba(20, 30, 45, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .bento-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.1);
            border-color: #42a5f5;
        }

        .stat-label {
            font-size: 0.8rem;
            color: var(--adm-text-sec);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--adm-text);
        }

        .hidden {
            display: none !important;
        }

        .select-glass {
            appearance: none;
            background-image: url('data:image/svg+xml;utf8,<svg fill="%23888888" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/></svg>');
            background-repeat: no-repeat;
            background-position: right 15px center;
            background-size: 20px;
            padding-right: 40px;
            font-weight: 600;
        }

        /* --- Premium Buttons --- */
        .btn-glass {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--adm-text);
            backdrop-filter: blur(10px);
            padding: 12px 25px;
            border-radius: 16px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }

        .btn-glass:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .btn-outline-accent {
            background: transparent;
            border: 2px solid #42a5f5;
            color: #42a5f5;
        }

        .btn-outline-accent:hover {
            background: rgba(66, 165, 245, 0.1);
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(66, 165, 245, 0.2);
        }

        /* --- Grid & Cards --- */
        .qoldiq-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 15px;
        }

        .qoldiq-card {
            background: rgba(20, 30, 45, 0.55);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
        }

        .qoldiq-card:hover {
            transform: translateY(-6px);
            border-color: rgba(66, 165, 245, 0.35);
            box-shadow: 0 10px 25px rgba(66, 165, 245, 0.15);
        }

        .card-visual {
            height: 120px;
            background: linear-gradient(135deg, rgba(66, 165, 245, 0.08), rgba(66, 165, 245, 0.02));
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            margin-bottom: 12px;
            position: relative;
        }

        .badge-length {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(66, 165, 245, 0.15);
            color: #42a5f5;
            border: 1px solid rgba(66, 165, 245, 0.3);
            padding: 4px 8px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.8rem;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin: 0 0 10px 0;
            color: #fff;
        }

        .spec-chip {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 4px 8px;
            font-size: 0.72rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.65);
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            padding-top: 12px;
            margin-top: 12px;
        }

        .qty-val {
            font-size: 1.2rem;
            font-weight: 800;
            color: #00ff88;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.25);
        }

        .card-actions {
            display: flex;
            gap: 6px;
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            width: 32px;
            height: 32px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            transition: all 0.2s ease;
        }

        .action-btn:hover {
            background: rgba(66, 165, 245, 0.15);
            border-color: rgba(66, 165, 245, 0.3);
            transform: scale(1.08);
        }

        .action-btn.delete:hover {
            background: rgba(255, 77, 79, 0.15);
            border-color: rgba(255, 77, 79, 0.3);
        }
    </style>
</head>

<body class="warehouse-body">
    <div id="mainApp" class="admin-layout">
        <!-- Sidebar -->
        <aside class="sidebar-slim">
            <div class="logo-icon-v2" style="font-size: 1.5rem; color: #007c52; margin-bottom: 40px; font-weight: 900; cursor: pointer; display: flex; align-items: center; justify-content: center; background: rgba(0, 124, 82, 0.1); width: 45px; height: 45px; border-radius: 12px;" onclick="window.location.href='romix_ombor.html'" title="Romix Omboriga Qaytish">
                ↩️</div>
            <div class="nav-icon active" title="Oynak">🪟</div>
            <div class="nav-icon" id="logoutBtn" onclick="localStorage.removeItem('currentUser'); window.location.href = '/';">🚪</div>
        </aside>

        <main class="admin-main">
            <!-- Top Nav -->
            <nav class="top-nav-v2">
                <div class="nav-links-v2" style="display: flex; align-items: center; gap: 8px;">
                    <button class="tab-btn" onclick="window.location.href='romix_ombor.html'" style="background: rgba(0, 210, 255, 0.1); color: #00d2ff; border: 1px solid rgba(0, 210, 255, 0.2); border-radius: 12px; font-weight: 700; display: flex; align-items: center; gap: 6px; padding: 8px 16px; margin-right: 10px;">
                        ⬅️ Orqaga Qaytish
                    </button>
                    <button class="tab-btn active">Oynak</button>
                </div>
                <div style="display: flex; gap: 20px; align-items: center;">
                    <button id="themeToggle" class="theme-toggle" onclick="document.body.classList.toggle('dark-mode');">🌙</button>
                    <div style="text-align: right;">
                        <div id="userName" style="font-weight: 600; font-size: 0.9rem;">RAHBAR</div>
                        <div id="userRole" style="font-size: 0.7rem; color: var(--adm-text-sec);">SENIOR OPERATOR</div>
                    </div>
                </div>
            </nav>

            <section id="oynak-view" class="warehouse-section">
                <!-- Title Header -->
                <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 25px;">
                    <div>
                        <h1 style="font-size: 2.2rem; font-weight: 600;">Oynak (Shisha) Ombori</h1>
                        <p style="color: var(--adm-text-sec);">Oynak/shisha zaxirasini hisobga olish</p>
                    </div>
                    <div style="display:flex; gap:12px; flex-wrap:wrap;">
                        <button id="openOynakModal" class="btn-glass btn-outline-accent">
                            <span style="font-size: 1.2rem;">+</span> Yangi Oynak Qo'shish
                        </button>
                    </div>
                </div>

                <!-- Stats Cards -->
                <div class="bento-container">
                    <div class="bento-item" style="grid-column: span 4;">
                        <span class="stat-label">Jami Turlari</span>
                        <div class="stat-value" id="statTotalTypes">--</div>
                        <div style="font-size: 0.8rem; color: #007c52; margin-top: 10px;">Faol turlar soni</div>
                    </div>
                    <div class="bento-item" style="grid-column: span 4;">
                        <span class="stat-label">Jami Miqdor</span>
                        <div class="stat-value" id="statTotalQty">--</div>
                        <div style="font-size: 0.8rem; color: var(--adm-text-sec); margin-top: 10px;">Barcha turlar bo'yicha</div>
                    </div>
                    <div class="bento-item" style="grid-column: span 4;">
                        <span class="stat-label">Jami Qiymati</span>
                        <div class="stat-value" id="statTotalVal">--</div>
                        <div style="font-size: 0.8rem; color: #42a5f5; margin-top: 10px;">Ombor qiymati</div>
                    </div>
                </div>

                <!-- Search & Actions Bar -->
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <h3 style="font-weight: 700; margin: 0;">Oynaklar Ro'yxati</h3>
                    <input type="text" id="oynakSearch" placeholder="Turi, nomi yoki o'lchami bo'yicha qidirish..." class="form-input-v2" style="width: 320px; margin-bottom:0; background:rgba(255,255,255,0.02); border:1px solid rgba(255,255,255,0.08);">
                </div>

                <!-- Main Grid -->
                <div class="qoldiq-grid" id="oynakGrid">
                    <!-- Oynak cards will load here -->
                </div>
            </section>
        </main>
    </div>

    <!-- Modal: Yangi Oynak Qo'shish -->
    <div id="oynakModal" class="hidden"
        style="position:fixed; inset:0; background:rgba(0,0,0,0.8); backdrop-filter:blur(8px); z-index:3000; display:flex; align-items:center; justify-content:center; padding:20px;">
        <div class="user-form-modal" style="width: 460px; background:var(--adm-surface);">
            <div style="display:flex; align-items:center; gap:15px; margin-bottom:20px;">
                <span style="font-size: 1.8rem;">🪟</span>
                <h2 style="color:var(--adm-text); font-size:1.3rem; margin:0;">Yangi Oynak Qo'shish</h2>
            </div>

            <label class="form-label">Turi / Brend</label>
            <input type="text" id="okBrand" class="form-input-v2" placeholder="Masalan: Ikki Qavatli Shisha-Paket" style="margin-bottom:12px;">

            <label class="form-label">Nomi</label>
            <input type="text" id="okName" class="form-input-v2" placeholder="Masalan: Tinted Bronza 4mm" style="margin-bottom:12px;">

            <label class="form-label">O'lcham</label>
            <input type="text" id="okSize" class="form-input-v2" placeholder="Masalan: 1200x1500mm" style="margin-bottom:12px;">

            <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px; margin-bottom:12px;">
                <div>
                    <label class="form-label">Birlik</label>
                    <select id="okUnit" class="form-input-v2 select-glass" style="margin:0;">
                        <option value="dona">dona</option>
                        <option value="m2">m²</option>
                        <option value="list">list</option>
                    </select>
                </div>
                <div>
                    <label class="form-label">Miqdori</label>
                    <input type="number" id="okQty" placeholder="0" min="0" step="0.01" class="form-input-v2" style="margin:0;">
                </div>
            </div>

            <label class="form-label">Narxi (birlik uchun)</label>
            <input type="number" id="okPrice" class="form-input-v2" placeholder="0" min="0" style="margin-bottom:20px;">

            <div style="display:flex; gap:10px;">
                <button id="saveOynakBtn" style="flex:1; background:#42a5f5; color:#000; border:none; padding:14px; border-radius:12px; font-weight:700; cursor:pointer;">Qo'shish</button>
                <button id="closeOynakModal" style="flex:1; background:rgba(255,255,255,0.1); color:var(--adm-text); border:none; padding:14px; border-radius:12px; cursor:pointer;">Yopish</button>
            </div>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script type="module">
        import { supabase } from '@/core/supabase.js';

        // Setup user details from localStorage
        const user = JSON.parse(localStorage.getItem('currentUser') || '{}');
        if (user) {
            document.getElementById('userName').textContent = (user.full_name || user.username || 'RAHBAR').toUpperCase();
        }

        // oynakCache — xotiradagi joriy ro'yxat nusxasi. MUHIM: bu yerda "jadval bo'sh bo'lsa
        // soxta namunaviy ma'lumot bilan avtomatik to'ldirish" YO'Q — Tozalash tugmasi bilan
        // ziddiyatga kirmasligi uchun (haqiqiy bo'sh holat "bo'sh" bo'lib qolishi kerak).
        let oynakCache = [];

        async function fetchOynakData() {
            try {
                const { data, error } = await supabase.from('romix_oynak').select('*').order('created_at', { ascending: false });
                if (error) throw error;
                oynakCache = data || [];
                localStorage.setItem('romix_oynak_local', JSON.stringify(oynakCache));
            } catch (e) {
                console.warn('Oynak fetch xatosi, localStorage fallback:', e);
                try { oynakCache = JSON.parse(localStorage.getItem('romix_oynak_local')) || []; } catch { oynakCache = []; }
            }
        }

        function renderOynak(searchQuery = '') {
            const grid = document.getElementById('oynakGrid');

            let filtered = oynakCache;
            if (searchQuery) {
                const q = searchQuery.toLowerCase().trim();
                filtered = filtered.filter(o =>
                    (o.product_name || '').toLowerCase().includes(q) ||
                    (o.brand || '').toLowerCase().includes(q) ||
                    (o.size || '').toLowerCase().includes(q)
                );
            }

            let totalQty = 0, totalVal = 0;
            filtered.forEach(o => {
                const qty = Number(o.stock_quantity) || 0;
                totalQty += qty;
                totalVal += qty * (Number(o.price) || 0);
            });

            document.getElementById('statTotalTypes').textContent = filtered.length;
            document.getElementById('statTotalQty').textContent = totalQty.toLocaleString('uz-UZ');
            document.getElementById('statTotalVal').textContent = totalVal.toLocaleString('uz-UZ') + ' so\'m';

            grid.innerHTML = '';
            if (filtered.length === 0) {
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align:center; padding:50px; color:#888; font-weight:600;">Oynak topilmadi.</div>';
                return;
            }

            filtered.forEach(o => {
                const card = document.createElement('div');
                card.className = 'qoldiq-card';
                card.innerHTML = `
                    <div class="card-visual">
                        🪟
                        ${o.size ? `<span class="badge-length">${o.size}</span>` : ''}
                    </div>
                    <h4 class="card-title">${o.product_name || o.brand || "Noma'lum"}</h4>
                    <div style="margin-bottom: 12px; display:flex; gap:6px; flex-wrap:wrap;">
                        <span class="spec-chip">🏷️ ${o.brand || "Noma'lum"}</span>
                        <span class="spec-chip">💰 ${(Number(o.price) || 0).toLocaleString('uz-UZ')} so'm/${o.unit || 'dona'}</span>
                    </div>
                    <div class="card-footer">
                        <span class="qty-val">${(Number(o.stock_quantity) || 0).toLocaleString('uz-UZ')} ${o.unit || 'dona'}</span>
                        <div class="card-actions">
                            <button class="action-btn delete delete-btn" data-id="${o.id}" title="O'chirish" style="color:#ff4d4f;">🗑️</button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });

            document.querySelectorAll('.delete-btn').forEach(b => {
                b.onclick = async () => {
                    if (!confirm("Ushbu oynakni o'chirmoqchimisiz?")) return;
                    const id = b.dataset.id;
                    const { error } = await supabase.from('romix_oynak').delete().eq('id', id);
                    if (error) { alert("O'chirishda xato: " + error.message); return; }
                    oynakCache = oynakCache.filter(x => x.id !== id);
                    localStorage.setItem('romix_oynak_local', JSON.stringify(oynakCache));
                    renderOynak(document.getElementById('oynakSearch').value);
                };
            });
        }

        // Search trigger
        document.getElementById('oynakSearch').oninput = () => {
            renderOynak(document.getElementById('oynakSearch').value);
        };

        // Modal Controls
        const modal = document.getElementById('oynakModal');
        document.getElementById('openOynakModal').onclick = () => modal.classList.remove('hidden');
        document.getElementById('closeOynakModal').onclick = () => modal.classList.add('hidden');

        // Save New Oynak
        document.getElementById('saveOynakBtn').onclick = async () => {
            const brand = document.getElementById('okBrand').value.trim();
            const name = document.getElementById('okName').value.trim();
            const size = document.getElementById('okSize').value.trim();
            const unit = document.getElementById('okUnit').value;
            const qty = parseFloat(document.getElementById('okQty').value) || 0;
            const price = parseFloat(document.getElementById('okPrice').value) || 0;

            if (!brand || qty <= 0) {
                return alert("Turi/Brend va miqdorni to'g'ri kiriting!");
            }

            const newItem = {
                id: 'OYNAK-' + Date.now(),
                brand: brand,
                product_name: name || brand,
                size: size,
                unit: unit || 'dona',
                stock_quantity: qty,
                price: price
            };

            const btn = document.getElementById('saveOynakBtn');
            btn.disabled = true;
            btn.textContent = 'Saqlanmoqda...';
            const { data, error } = await supabase.from('romix_oynak').insert([newItem]).select();
            btn.disabled = false;
            btn.textContent = "Qo'shish";

            if (error) {
                alert("Saqlashda xato: " + error.message);
                return;
            }

            oynakCache.unshift((data && data[0]) || newItem);
            localStorage.setItem('romix_oynak_local', JSON.stringify(oynakCache));
            modal.classList.add('hidden');
            renderOynak();

            document.getElementById('okBrand').value = '';
            document.getElementById('okName').value = '';
            document.getElementById('okSize').value = '';
            document.getElementById('okQty').value = '';
            document.getElementById('okPrice').value = '';
        };

        // Run on start
        (async () => {
            await fetchOynakData();
            renderOynak();
        })();
    </script>
</body>

</html>
